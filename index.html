<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<meta name="description" content="ama — anonymous chat. No accounts, no names, just talk.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ama">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<title>ama · anonymous chat</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #161a23;
    --panel-2: #1c2130;
    --border: #262c3d;
    --text: #e7eaf2;
    --muted: #8a93a8;
    --accent: #6c8cff;
    --accent-2: #8a5cff;
    --radius: 16px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, rgba(108,140,255,0.08), transparent), var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
  }
  .app {
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 960px;
    height: 100dvh;
    padding: 0 14px;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 16px 4px 12px;
    flex-shrink: 0;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .brand h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; }
  .brand h1 span {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .tagline { font-size: 0.8rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #you {
    font-size: 0.82rem; color: var(--muted); background: var(--panel);
    border: 1px solid var(--border); padding: 6px 12px; border-radius: 999px;
    white-space: nowrap; flex-shrink: 0;
  }
  #you b { color: var(--accent); font-weight: 600; }

  #chat {
    flex: 1;
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scroll-behavior: smooth;
    overscroll-behavior: contain;
  }
  .msg { max-width: 85%; display: flex; flex-direction: column; }
  .msg.mine { align-self: flex-end; align-items: flex-end; }
  .msg .meta { font-size: 0.72rem; color: var(--muted); margin: 0 5px 4px; }
  .msg .meta .tag { color: var(--accent); }
  .msg.mine .meta .tag { color: var(--accent-2); }
  .msg .bubble {
    background: var(--panel-2);
    border: 1px solid var(--border);
    padding: 10px 14px;
    border-radius: 18px;
    line-height: 1.5;
    word-wrap: break-word;
    overflow-wrap: break-word;
    white-space: pre-wrap;
    font-size: 0.95rem;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .msg.mine .bubble {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border: none;
    color: #fff;
  }
  .bubble .caption { white-space: pre-wrap; }
  .bubble img, .bubble video {
    max-width: min(420px, 100%);
    max-height: 320px;
    border-radius: 12px;
    display: block;
  }
  .bubble audio { max-width: 100%; height: 36px; }
  .bubble .file {
    display: flex; align-items: center; gap: 10px;
    color: inherit; text-decoration: none;
    background: rgba(0,0,0,0.18);
    padding: 10px 14px; border-radius: 12px;
    font-size: 0.85rem;
  }
  .bubble .file .icon { font-size: 1.4rem; }
  .bubble .file .fname { font-weight: 600; word-break: break-all; }
  .bubble .file .fsize { opacity: 0.7; font-size: 0.72rem; }
  .system { align-self: center; font-size: 0.74rem; color: var(--muted); background: var(--panel-2); padding: 5px 14px; border-radius: 999px; }

  footer { flex-shrink: 0; padding: 12px 0 calc(12px + env(safe-area-inset-bottom)); }
  #attachBar {
    display: flex; align-items: center; gap: 10px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 10px 12px;
    margin-bottom: 8px;
  }
  #attachPreview { flex: 1; min-width: 0; font-size: 0.82rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #attachPreview img, #attachPreview video { max-height: 64px; border-radius: 8px; vertical-align: middle; margin-right: 8px; }
  #attachRemove { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 1rem; padding: 4px 8px; }
  #attachRemove:hover { color: var(--text); }
  #statusLine { text-align: center; font-size: 0.72rem; color: var(--muted); margin-top: 6px; min-height: 1em; }

  form {
    display: flex;
    gap: 8px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px;
    align-items: flex-end;
  }
  .iconBtn {
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 1.35rem;
    padding: 6px 10px;
    cursor: pointer;
    border-radius: 10px;
    line-height: 1;
  }
  .iconBtn:hover { color: var(--accent); background: var(--panel-2); }
  #input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 1rem;
    padding: 10px 4px;
    min-width: 0;
    resize: none;
    max-height: 120px;
    font-family: inherit;
    line-height: 1.4;
  }
  button.send {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 11px 20px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
  }
  button.send:disabled { opacity: 0.5; cursor: wait; }
  button:active { transform: scale(0.97); }

  /* Desktop: spacious layout */
  @media (min-width: 800px) {
    .app { padding: 0 20px 20px; height: 100vh; }
    header { padding: 26px 6px 16px; }
    #chat { padding: 24px; }
    .msg { max-width: 70%; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <h1><span>ama</span></h1>
      <div class="tagline">anonymous chat — no accounts, just vibes</div>
    </div>
    <div id="you">you: <b>…</b></div>
  </header>

  <div id="chat" aria-live="polite"></div>

  <div id="attachBar" hidden>
    <div id="attachPreview"></div>
    <button type="button" id="attachRemove" title="Remove attachment">✕</button>
  </div>

  <footer>
    <form id="form" autocomplete="off">
      <button type="button" class="iconBtn" id="attachBtn" title="Attach image, video or file">📎</button>
      <input type="file" id="fileInput" hidden accept="*/*">
      <textarea id="input" rows="1" maxlength="500" placeholder="Say something anonymous…" aria-label="Message"></textarea>
      <button type="submit" class="send" id="sendBtn">Send</button>
    </form>
    <div id="statusLine"></div>
  </footer>
</div>

<script>
(() => {
  const chat = document.getElementById("chat");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("sendBtn");
  const statusLine = document.getElementById("statusLine");
  const you = document.getElementById("you");
  const attachBtn = document.getElementById("attachBtn");
  const fileInput = document.getElementById("fileInput");
  const attachBar = document.getElementById("attachBar");
  const attachPreview = document.getElementById("attachPreview");
  const attachRemove = document.getElementById("attachRemove");

  // ---- Anonymous identity: Anonymous#XXXX (persisted locally) ----
  let name = localStorage.getItem("ama_name");
  if (!name || !/^Anonymous#\d{4}$/.test(name)) {
    name = "Anonymous#" + String(Math.floor(Math.random() * 10000)).padStart(4, "0");
    localStorage.setItem("ama_name", name);
  }
  you.innerHTML = 'you: <b></b>';
  you.querySelector("b").textContent = name;

  let lastId = 0;
  let polling = null;
  let pendingFile = null;   // { file, url(ObjectURL), isImage, isVideo }
  let uploading = false;

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function fmtSize(bytes) {
    if (bytes >= 1048576) return (bytes / 1048576).toFixed(1) + " MB";
    if (bytes >= 1024) return (bytes / 1024).toFixed(0) + " KB";
    return bytes + " B";
  }

  // ---- Media rendering ----
  function mediaNode(media, mine) {
    const type = media.type || "";
    if (type.startsWith("image/")) {
      const img = el("img");
      img.src = media.url;
      img.alt = media.name || "image";
      img.loading = "lazy";
      img.style.cursor = "zoom-in";
      img.addEventListener("click", () => window.open(media.url, "_blank"));
      return img;
    }
    if (type.startsWith("video/")) {
      const v = el("video");
      v.src = media.url;
      v.controls = true;
      v.preload = "metadata";
      return v;
    }
    if (type.startsWith("audio/")) {
      const a = el("audio");
      a.src = media.url;
      a.controls = true;
      return a;
    }
    // Any other format → download link
    const link = el("a", "file");
    link.href = media.url;
    link.download = media.name || "file";
    link.appendChild(el("span", "icon", "📄"));
    const wrap = el("span");
    wrap.appendChild(el("div", "fname", media.name || "file"));
    wrap.appendChild(el("div", "fsize", fmtSize(media.size || 0)));
    link.appendChild(wrap);
    return link;
  }

  function render(m) {
    if (m.id <= lastId) return;
    lastId = m.id;
    const mine = m.name === name;
    const wrap = el("div", "msg" + (mine ? " mine" : ""));
    const meta = el("div", "meta");
    const tag = el("span", "tag", m.name);
    meta.appendChild(tag);
    wrap.appendChild(meta);

    const bubble = el("div", "bubble");
    if (m.media) bubble.appendChild(mediaNode(m.media, mine));
    if (m.text) bubble.appendChild(el("div", "caption", m.text));
    if (!m.media && !m.text) return;
    wrap.appendChild(bubble);
    chat.appendChild(wrap);

    while (chat.children.length > 200) chat.removeChild(chat.firstChild);
    chat.scrollTop = chat.scrollHeight;
  }

  // ---- Attachment UI ----
  function setPendingFile(file) {
    if (pendingFile) URL.revokeObjectURL(pendingFile.url);
    if (!file) {
      pendingFile = null;
      attachBar.hidden = true;
      attachPreview.innerHTML = "";
      fileInput.value = "";
      return;
    }
    if (file.size > 24 * 1024 * 1024) {
      statusLine.textContent = "file too large — max is 24 MB";
      return;
    }
    const isImage = file.type.startsWith("image/");
    const isVideo = file.type.startsWith("video/");
    pendingFile = { file, url: URL.createObjectURL(file), isImage, isVideo };
    attachBar.hidden = false;
    attachPreview.innerHTML = "";
    if (isImage) {
      const img = el("img"); img.src = pendingFile.url; attachPreview.appendChild(img);
    } else if (isVideo) {
      const v = el("video"); v.src = pendingFile.url; v.muted = true; attachPreview.appendChild(v);
    }
    attachPreview.appendChild(el("span", "", file.name + " · " + fmtSize(file.size)));
  }

  attachBtn.addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", () => setPendingFile(fileInput.files[0]));
  attachRemove.addEventListener("click", () => setPendingFile(null));

  // Auto-grow textarea
  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 120) + "px";
  });

  // ---- Sending ----
  async function uploadFile(file) {
    const res = await fetch("/api/upload?filename=" + encodeURIComponent(file.name), {
      method: "POST",
      headers: { "Content-Type": file.type || "application/octet-stream" },
      body: file,
    });
    if (!res.ok) throw new Error("upload failed");
    return res.json();
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (uploading) return;
    const text = input.value.trim();
    if (!text && !pendingFile) return;

    uploading = true;
    sendBtn.disabled = true;
    input.value = "";
    input.style.height = "auto";
    statusLine.textContent = pendingFile ? "uploading…" : "";

    try {
      let media = null;
      if (pendingFile) {
        media = await uploadFile(pendingFile.file);
        setPendingFile(null);
      }
      const res = await fetch("/api/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, text, media })
      });
      if (res.ok) {
        render((await res.json()).message);
        statusLine.textContent = "";
      }
    } catch (err) {
      statusLine.textContent = "couldn't send — " + err.message;
    } finally {
      uploading = false;
      sendBtn.disabled = false;
    }
  });

  // ---- Receiving ----
  async function fetchMessages() {
    try {
      const res = await fetch("/api/messages?after=" + lastId);
      if (!res.ok) throw new Error(res.status);
      const data = await res.json();
      data.messages.forEach(render);
      statusLine.textContent = "";
    } catch {
      statusLine.textContent = "reconnecting…";
    } finally {
      polling = setTimeout(fetchMessages, 2000);
    }
  }

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      clearTimeout(polling);
      polling = null;
    } else if (!polling) {
      fetchMessages();
    }
  });

  // PWA service worker
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js").catch(() => {});
  }

  fetchMessages();
})();
</script>
</body>
</html>
