<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<meta name="description" content="ama — anonymous chat. No accounts, no names, just talk.">
<title>ama · anonymous chat</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #161a23;
    --panel-2: #1c2130;
    --border: #262c3d;
    --text: #e7eaf2;
    --muted: #8a93a8;
    --accent: #6c8cff;
    --accent-2: #8a5cff;
    --radius: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
  }
  .app {
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 760px;
    height: 100dvh;
    padding: 0 12px;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 4px 10px;
    flex-shrink: 0;
  }
  .brand { display: flex; align-items: baseline; gap: 8px; }
  .brand h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.02em; }
  .brand h1 span {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .tagline { font-size: 0.78rem; color: var(--muted); }
  #you { font-size: 0.8rem; color: var(--muted); background: var(--panel); border: 1px solid var(--border); padding: 5px 10px; border-radius: 999px; }
  #you b { color: var(--accent); font-weight: 600; }

  #chat {
    flex: 1;
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    scroll-behavior: smooth;
    overscroll-behavior: contain;
  }
  .msg { max-width: 82%; display: flex; flex-direction: column; }
  .msg.mine { align-self: flex-end; align-items: flex-end; }
  .msg .meta { font-size: 0.7rem; color: var(--muted); margin: 0 4px 3px; }
  .msg .bubble {
    background: var(--panel-2);
    border: 1px solid var(--border);
    padding: 9px 13px;
    border-radius: 16px;
    line-height: 1.45;
    word-wrap: break-word;
    white-space: pre-wrap;
    font-size: 0.92rem;
  }
  .msg.mine .bubble {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border: none;
    color: #fff;
  }
  .system { align-self: center; font-size: 0.72rem; color: var(--muted); background: var(--panel-2); padding: 4px 12px; border-radius: 999px; }

  footer { flex-shrink: 0; padding: 10px 0 calc(10px + env(safe-area-inset-bottom)); }
  form {
    display: flex;
    gap: 8px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 8px;
  }
  #input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 1rem;
    padding: 8px 4px;
    min-width: 0;
  }
  button {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
  }
  button:active { transform: scale(0.97); }
  #status { text-align: center; font-size: 0.7rem; color: var(--muted); margin-top: 6px; min-height: 1em; }

  /* Desktop: comfortable paddings */
  @media (min-width: 700px) {
    .app { padding: 0 16px 16px; height: 100vh; }
    header { padding-top: 22px; }
    #chat { padding: 20px; }
    .msg { max-width: 65%; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <h1><span>ama</span></h1>
      <div class="tagline">anonymous chat — no accounts, no names</div>
    </div>
    <div id="you">you: <b>…</b></div>
  </header>

  <div id="chat" aria-live="polite"></div>

  <footer>
    <form id="form" autocomplete="off">
      <input id="input" maxlength="500" placeholder="Say something anonymous…" aria-label="Message">
      <button type="submit">Send</button>
    </form>
    <div id="status"></div>
  </div>
</div>

<script>
(() => {
  const chat = document.getElementById("chat");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const status = document.getElementById("status");
  const you = document.getElementById("you");

  const ADJ = ["Calm","Swift","Silent","Brave","Neon","Cosmic","Lunar","Solar","Wild","Gentle","Clever","Fuzzy","Rapid","Quiet","Stellar"];
  const ANIMAL = ["Otter","Falcon","Panda","Tiger","Moth","Wolf","Koala","Heron","Fox","Whale","Lynx","Raven","Gecko","Dolphin","Hedgehog"];

  // Anonymous identity persisted locally (never sent anywhere but as display name)
  let name = localStorage.getItem("ama_name");
  if (!name) {
    name = ADJ[Math.random() * ADJ.length | 0] + ANIMAL[Math.random() * ANIMAL.length | 0] + (Math.random() * 90 + 10 | 0);
    localStorage.setItem("ama_name", name);
  }
  you.innerHTML = 'you: <b></b>';
  you.querySelector("b").textContent = name;

  let lastId = 0;
  let polling = null;

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function render(m) {
    if (m.id <= lastId) return;
    lastId = m.id;
    const wrap = el("div", "msg" + (m.name === name ? " mine" : ""));
    wrap.appendChild(el("div", "meta", m.name));
    wrap.appendChild(el("div", "bubble", m.text));
    chat.appendChild(wrap);
    while (chat.children.length > 200) chat.removeChild(chat.firstChild);
    chat.scrollTop = chat.scrollHeight;
  }

  async function fetchMessages() {
    try {
      const res = await fetch("/api/messages?after=" + lastId);
      if (!res.ok) throw new Error(res.status);
      const data = await res.json();
      data.messages.forEach(render);
      status.textContent = "";
    } catch {
      status.textContent = "reconnecting…";
    } finally {
      polling = setTimeout(fetchMessages, 2000);
    }
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    try {
      const res = await fetch("/api/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, text })
      });
      if (res.ok) {
        const data = await res.json();
        render(data.message);
      }
    } catch {
      status.textContent = "couldn't send — check your connection";
    }
  });

  // Stop polling when tab is hidden to save resources
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      clearTimeout(polling);
      polling = null;
    } else if (!polling) {
      fetchMessages();
    }
  });

  fetchMessages();
})();
</script>
</body>
</html>
